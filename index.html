<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GDC">
<meta name="theme-color" content="#1A1F29">
<link rel="manifest" href="/manifest.json">
<title>GDC — Gopang Digital Currency</title>
<style>
  /* 리디렉션 대기 중 화면 — 짧은 플래시 방지 */
  html, body {
    margin: 0; padding: 0;
    background: #1A1F29;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    font-family: 'Noto Sans KR', -apple-system, sans-serif;
  }
  .splash {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    opacity: 0;
    animation: fadeIn 0.25s ease 0.05s forwards;
  }
  @keyframes fadeIn { to { opacity: 1; } }
  .logo-mark {
    width: 48px; height: 48px;
    background: #3ECF8E;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    color: #fff;
    font-weight: 600;
  }
  .logo-text {
    font-size: 14px;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.04em;
  }
</style>
</head>
<body>
<div class="splash">
  <div class="logo-mark">₮</div>
  <div class="logo-text">GDC</div>
</div>

<script>
  /**
   * GDC 진입점 라우터 (index.html)
   * ─────────────────────────────────────────────────────────
   * 규칙  ① 화면 너비 ≤ 768px   → webapp.html  (모바일 PWA)
   *       ② 화면 너비 >  768px   → desktop.html (랜딩 페이지)
   *
   * GWP 파라미터 (?gwp=1&ctx=...) 는 항상 webapp.html 로 전달.
   * 쿼리스트링·해시는 리디렉션 대상으로 그대로 전달한다.
   * ─────────────────────────────────────────────────────────
   */
  (function () {
    var qs     = location.search;   // e.g. "?gwp=1&ctx=..."
    var hash   = location.hash;     // e.g. "#rates"
    var isGWP  = qs.indexOf('gwp=1') !== -1;

    // GWP 호출이면 항상 webapp으로
    if (isGWP) {
      location.replace('webapp.html' + qs + hash);
      return;
    }

    // 화면 너비 기준 라우팅
    // window.innerWidth 는 페인트 전에도 신뢰할 수 있음
    var isMobile = window.innerWidth <= 768;
    var target   = isMobile ? 'webapp.html' : 'desktop.html';

    location.replace(target + qs + hash);
  })();
</script>
</body>
</html>
