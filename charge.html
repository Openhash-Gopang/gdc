<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDC 충전 — 혼디</title>
<script src="https://cdn.jsdelivr.net/gh/Openhash-Gopang/gopang@main/gopang-wallet.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Pretendard',sans-serif;background:#f5f5f5;color:#111;
  min-height:100dvh;padding:20px}
.wrap{max-width:480px;margin:0 auto}
h1{font-size:18px;margin-bottom:4px}
.sub{font-size:12.5px;color:#6b7280;margin-bottom:20px;line-height:1.6}
.balance-banner{display:none;background:#fff3cd;color:#664d03;border:1px solid #ffe69c;
  border-radius:10px;padding:11px 14px;font-size:13px;margin-bottom:14px;line-height:1.5}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px;margin-bottom:16px}
.card label{display:block;font-size:12.5px;color:#6b7280;margin-bottom:6px}
.card input{width:100%;padding:11px 13px;border:1px solid #e5e7eb;border-radius:10px;
  font-size:15px;margin-bottom:12px;font-family:inherit}
.quick-amounts{display:flex;gap:8px;margin-bottom:12px}
.quick-amounts button{flex:1;padding:8px;border:1px solid #e5e7eb;border-radius:8px;
  background:#fff;font-size:12.5px;cursor:pointer;font-family:inherit}
.quick-amounts button:hover{border-color:#1A73E8;color:#1A73E8}
.submit-btn{width:100%;padding:12px;border:none;border-radius:10px;background:#111;
  color:#fff;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
.submit-btn:disabled{background:#d1d5db;cursor:not-allowed}
.result{display:none;background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:20px}
.result-code{font-size:22px;font-weight:700;color:#1A73E8;text-align:center;
  letter-spacing:.5px;padding:10px 0;background:#f0f6ff;border-radius:10px;margin-bottom:14px}
.result-row{display:flex;justify-content:space-between;font-size:13px;padding:6px 0;
  border-bottom:1px dashed #f0f0f0}
.result-row:last-of-type{border-bottom:none}
.result-row .k{color:#6b7280}
.result-row .v{font-weight:600;text-align:right;margin-left:12px}
.guide{font-size:12.5px;color:#374151;line-height:1.6;background:#fafafa;
  border-radius:10px;padding:12px;margin-top:14px}
.status-pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px;
  border-radius:20px;margin-top:12px}
.status-pending{background:#FEF9E7;color:#92400E}
.status-matched{background:#E6F4EC;color:#1B6B3A}
.err{color:#9B1C1C;font-size:12.5px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>GDC 충전</h1>
  <div class="sub">
    고정 계좌로 입금하시면 관리자 확인 후 GDC가 자동 발행됩니다.
    최소 1,000원부터 신청 가능하며, 1,000원 = 1 GDC로 환산됩니다.
  </div>

  <div class="balance-banner" id="balance-banner"></div>

  <div class="card" id="request-card">
    <label for="krw-amount">충전할 금액(원)</label>
    <input type="number" id="krw-amount" placeholder="예: 10000" min="1000" step="1000">
    <div class="quick-amounts">
      <button onclick="setAmount(1000)">1,000원</button>
      <button onclick="setAmount(5000)">5,000원</button>
      <button onclick="setAmount(10000)">10,000원</button>
      <button onclick="setAmount(50000)">50,000원</button>
    </div>
    <button class="submit-btn" id="submit-btn" onclick="submitRequest()">충전 신청하기</button>
    <div class="err" id="err"></div>
  </div>

  <div class="result" id="result-card">
    <div class="result-code" id="match-code"></div>
    <div class="result-row"><span class="k">입금 계좌</span><span class="v" id="bank-account"></span></div>
    <div class="result-row"><span class="k">신청 금액</span><span class="v" id="req-amount"></span></div>
    <div class="result-row"><span class="k">신청 시각</span><span class="v" id="req-time"></span></div>
    <div class="guide" id="guide-text"></div>
    <div id="status-pill"></div>
  </div>
</div>

<script>
const WORKER_URL = 'https://hondi-proxy.tensor-city.workers.dev';
let userGuid = null;
let pollTimer = null;

function fmt(n) { return Math.round(n).toLocaleString('ko-KR'); }
function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = String(s ?? '');
  return div.innerHTML;
}
function setAmount(n) { document.getElementById('krw-amount').value = n; }
function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

// gopang-wallet.js가 이 페이지 로드 시 비동기 자동초기화한다(webapp.html 등과
// 동일 관례) — 준비될 때까지 짧게 폴링해 기다린다.
async function waitForWallet(timeoutMs = 5000) {
  const t0 = Date.now();
  while (!window.gopangWallet?.guid) {
    if (Date.now() - t0 > timeoutMs) return null;
    await new Promise(r => setTimeout(r, 100));
  }
  return window.gopangWallet.guid;
}

async function loadBalanceBanner(guid) {
  try {
    const res  = await fetch(`${WORKER_URL}/biz/balance-status?guid=${encodeURIComponent(guid)}`);
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.ok) return;
    const banner = document.getElementById('balance-banner');
    if (data.is_low_balance) {
      banner.textContent = `현재 잔액 약 ${fmt(data.balance_krw)}원 상당 — 곧 서비스 이용이 제한될 수 있어요.`;
      banner.style.display = 'block';
    } else {
      banner.textContent = `현재 잔액: 약 ${fmt(data.balance_krw)}원 상당`;
      banner.style.display = 'block';
    }
  } catch (e) { /* 조회 실패는 조용히 무시 — 배너는 보조 정보일 뿐 */ }
}

async function submitRequest() {
  showErr('');
  const amountInput = document.getElementById('krw-amount');
  const krwAmount = parseInt(amountInput.value, 10);
  if (!krwAmount || krwAmount < 1000) { showErr('최소 1,000원부터 신청 가능합니다.'); return; }

  const guid = userGuid || await waitForWallet();
  if (!guid) { showErr('지갑을 초기화하는 중입니다. 잠시 후 다시 시도해 주세요.'); return; }
  userGuid = guid;

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = '신청 중...';

  try {
    const res = await fetch(`${WORKER_URL}/biz/charge-request`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ guid, krw_amount: krwAmount }),
    });
    const data = await res.json().catch(() => null);
    if (!res.ok || !data?.ok) {
      showErr('신청 실패: ' + (data?.message || data?.error || res.status));
      btn.disabled = false; btn.textContent = '충전 신청하기';
      return;
    }
    renderResult(data);
    document.getElementById('request-card').style.display = 'none';
    document.getElementById('result-card').style.display = 'block';
    startPolling(guid, data.request_id);
  } catch (e) {
    showErr('오류: ' + e.message);
    btn.disabled = false; btn.textContent = '충전 신청하기';
  }
}

function renderResult(data) {
  document.getElementById('match-code').textContent = data.match_code;
  document.getElementById('bank-account').textContent = data.bank_account_info || '(계좌 정보 확인 중)';
  document.getElementById('req-amount').textContent = fmt(data.requested_krw) + '원';
  document.getElementById('req-time').textContent = new Date().toLocaleString('ko-KR');
  document.getElementById('guide-text').textContent = data.guide || '';
  setStatusPill('pending');
}

function setStatusPill(status) {
  const el = document.getElementById('status-pill');
  if (status === 'matched') {
    el.innerHTML = '<span class="status-pill status-matched">✓ 입금 확인 완료 · GDC 지급됨</span>';
  } else {
    el.innerHTML = '<span class="status-pill status-pending">⏳ 입금 확인 대기 중 — 자동으로 새로고침됩니다</span>';
  }
}

// 관리자가 charge-admin.html에서 확정하면 status가 matched로 바뀐다 —
// 사용자 쪽은 별도 알림 없이도 알 수 있도록 20초 간격으로 상태를 확인한다.
function startPolling(guid, requestId) {
  if (pollTimer) clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    try {
      const res  = await fetch(`${WORKER_URL}/biz/charge-status?guid=${encodeURIComponent(guid)}&request_id=${encodeURIComponent(requestId)}`);
      const data = await res.json().catch(() => null);
      if (!res.ok || !data?.ok) return;
      if (data.request?.status === 'matched') {
        setStatusPill('matched');
        clearInterval(pollTimer);
        loadBalanceBanner(guid); // 잔액 배너 갱신
      }
    } catch (e) { /* 폴링 실패는 조용히 무시하고 다음 주기에 재시도 */ }
  }, 20000);
}

(async function init() {
  const guid = await waitForWallet();
  if (guid) { userGuid = guid; loadBalanceBanner(guid); }
})();
</script>
</body>
</html>
